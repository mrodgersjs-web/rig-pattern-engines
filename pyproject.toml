[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig-pattern-engines"
version = "0.2.0"
description = "Three deterministic analysis engines for research-card corpora: crowding, contradiction, and vocabulary drift."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mike Rodgers" },
]
keywords = [
    "strategy",
    "pattern-recognition",
    "research-cards",
    "contradiction-detection",
    "vocabulary-drift",
    "crowding-score",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.scripts]
rig-anticrowd = "rig_pattern_engines.pattern_anticrowd:main"
rig-contradiction = "rig_pattern_engines.pattern_contradiction:main"
rig-drift = "rig_pattern_engines.pattern_drift:main"
rig-pattern-dashboard = "rig_pattern_engines.pattern_dashboard:main"
rig-pattern-generate = "rig_pattern_engines.pattern_generate:main"

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rig-pattern-engines"
Repository = "https://github.com/mrodgersjs-web/rig-pattern-engines"
Issues = "https://github.com/mrodgersjs-web/rig-pattern-engines/issues"

[tool.hatch.build.targets.wheel]
packages = ["rig_pattern_engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["rig_pattern_engines"]
omit = ["rig_pattern_engines/omniscout_build_cards.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
