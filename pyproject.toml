[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig-pattern-engines"
version = "0.1.0"
description = "Three deterministic pattern-recognition engines for strategic build-card analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RIG Intelligence" },
]
keywords = [
    "strategy",
    "pattern-recognition",
    "build-cards",
    "contradiction-arbitrage",
    "epistemic-drift",
    "anti-crowd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
rig-anticrowd = "rig_pattern_engines.pattern_anticrowd:main"
rig-contradiction = "rig_pattern_engines.pattern_contradiction:main"
rig-drift = "rig_pattern_engines.pattern_drift:main"
rig-pattern-dashboard = "rig_pattern_engines.pattern_dashboard:main"
rig-pattern-generate = "rig_pattern_engines.pattern_generate:main"

[project.urls]
Homepage = "https://github.com/rig-intelligence/rig-pattern-engines"
Repository = "https://github.com/rig-intelligence/rig-pattern-engines"
Issues = "https://github.com/rig-intelligence/rig-pattern-engines/issues"

[tool.hatch.build.targets.wheel]
packages = ["rig_pattern_engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
